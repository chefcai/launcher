name: Android CI

on:
  push:
    branches: [ "master", "feature/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # Restored on every branch, not only master. Without a stable debug key Gradle
    # generates a fresh one per run, so every build carries a different signature,
    # and sideloading a new build over an older one fails with
    # INSTALL_FAILED_UPDATE_INCOMPATIBLE until the app is uninstalled - which wipes
    # folders and settings and makes iterative testing on a device painful.
    # Written to both locations Gradle may look in for the debug keystore.
    - name: Read Debug Keystore
      run: |
        if [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
          echo "ANDROID_DEBUG_KEYSTORE is not set - Gradle will generate a throwaway"
          echo "debug key and this build will NOT install over previous builds."
          exit 0
        fi
        mkdir -p ~/.config/.android/ ~/.android/
        printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.config/.android/debug.keystore
        cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
      env:
        ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: launcher-debug-${{ github.sha }}
        path: app/build/outputs/apk/default/debug/app-default-debug.apk

    # Upstream publishes its own rolling pre-release from master. This fork's
    # release branch is feature/app-folders (see README), and the README's
    # download link already points at tag `folders-debug` / asset
    # `ulauncher-folders-debug.apk`, so the fork's copy of this step targets
    # those names instead of recreating upstream's under a different tag.
    - name: Fork release variables
      if: github.ref == 'refs/heads/feature/app-folders' && github.repository == 'chefcai/launcher'
      id: fork_release
      run: |
        VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        cp app/build/outputs/apk/default/debug/app-default-debug.apk ulauncher-folders-debug.apk
    - name: Delete Old Pre-Release
      if: github.ref == 'refs/heads/master' && github.repository == 'jrpie/launcher'
      run: gh release delete pre-release --cleanup-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Delete Old Fork Pre-Release
      if: github.ref == 'refs/heads/feature/app-folders' && github.repository == 'chefcai/launcher'
      run: gh release delete folders-debug --cleanup-tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/master' && github.repository == 'jrpie/launcher'
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: "pre-release"
        name: "Debug (only for testing)"
        prerelease: true
        body: "This debug build is updated automatically whenever there is a commit to master. It is signed with a debug certificate and uses the package name `de.jrpie.android.launcher.debug`. Furthermore, the app name is set to `µLauncher [debug]`. **Debug builds are not suited for everyday use.**"
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: "app/build/outputs/apk/default/debug/app-default-debug.apk"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Create Fork Pre-Release
      if: github.ref == 'refs/heads/feature/app-folders' && github.repository == 'chefcai/launcher'
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: "folders-debug"
        name: "Folders (debug build) - ${{ steps.fork_release.outputs.version_name }}"
        prerelease: true
        body: |
          **Debug build - for testing only.** Published automatically by CI from branch `feature/app-folders`.

          - Version: **${{ steps.fork_release.outputs.version_name }}-debug (${{ github.run_number }})**
          - Commit: `${{ github.sha }}`
          - Package id: `de.jrpie.android.launcher.debug`

          Install straight over the top - do not uninstall. Signed with a stable debug key.

          This build has **not** been manually verified on a device - it is only
          confirmed to compile and pass the automated test suite. See the commit
          history and linked pull requests for what changed.
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: "ulauncher-folders-debug.apk"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
