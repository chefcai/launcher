name: ci

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master, "feature/**"]

jobs:
  baseline:
    permissions:
      contents: read
      pull-requests: write
    uses: chefcai/ci-templates/.github/workflows/baseline.yml@main

  kotlin:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: chefcai/ci-templates/.github/workflows/kotlin.yml@main
    with:
      is-android: true
      build-cmd: "./gradlew assembleDebug"
      test-cmd: "./gradlew test"
